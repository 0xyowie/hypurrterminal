<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hypurr Terminal — The Observatory</title>
<meta name="description" content="All 4,600 Hypurrs on one star map, arranged by visual family. Pan, zoom into full-resolution art, tap any Hypurr to open its passport.">
<meta name="theme-color" content="#0E0B08">
<meta property="og:type" content="website">
<meta property="og:title" content="Hypurr Terminal — The Observatory"><meta property="og:description" content="The whole pride on one map, arranged by visual family.">
<meta property="og:image" content="https://hypurrterminal.xyz/og.png">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://hypurrterminal.xyz/og.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23100D0A'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/base.css">
<script src="/assets/app.js"></script>
<style>
  html,body{height:100%}
  body{overflow:hidden;overscroll-behavior:none}
  #space{position:fixed;inset:0;z-index:1;cursor:grab}
  #space.grabbing{cursor:grabbing}
  #space canvas{display:block}
  #ov{position:fixed;left:0;top:0;z-index:2;pointer-events:none;transform-origin:0 0;will-change:transform}
  #ov img{position:absolute;width:88px;height:88px;border-radius:14px;opacity:0;transition:opacity .25s}
  #ov img.in{opacity:1}
  #ov .halo{position:absolute;width:88px;height:88px;border-radius:16px;border:3px solid var(--mint);box-shadow:0 0 30px rgba(84,224,203,.8);animation:halo 1.6s ease infinite}
  @keyframes halo{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.35}}
  header.site{background:linear-gradient(180deg,rgba(14,11,8,.9),rgba(14,11,8,.55));backdrop-filter:blur(10px)}
  .hud{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:linear-gradient(0deg,rgba(14,11,8,.92),rgba(14,11,8,0));pointer-events:none}
  .hud>*{pointer-events:auto}
  .hud .find{display:flex;align-items:center;gap:8px;background:rgba(30,23,15,.92);border:1px solid var(--line2);border-radius:12px;padding:9px 13px}
  .hud input{border:0;outline:0;background:transparent;color:var(--ink);font-family:'Inter';font-weight:600;font-size:14px;width:110px}
  .hud .hint{font-size:12px;color:var(--faint);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
  .hud .kicker{margin:0}
  .zoomer{display:flex;gap:6px;margin-left:auto}
  .zoomer button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line2);background:rgba(30,23,15,.92);color:var(--ink);font-size:20px;font-weight:600;cursor:pointer;transition:.25s var(--ease)}
  .zoomer button:hover{background:rgba(255,255,255,.08)}
  .tip{position:fixed;z-index:30;pointer-events:none;background:#000;border:1px solid var(--line2);color:var(--ink);
    font-weight:600;font-size:12.5px;padding:7px 11px;border-radius:10px;opacity:0;transition:opacity .12s}
  .load{position:fixed;inset:0;z-index:5;display:grid;place-items:center;color:var(--faint);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;transition:opacity .8s;pointer-events:none}
  @media(max-width:640px){ .hud .hint{display:none} .hud input{width:88px} }
</style></head>
<body data-page="observatory">
<header class="site"><div class="bar">
  <a class="brand" href="/"><span class="logo">🐾</span><span>HYPURR</span></a>
  <nav class="top">
    <a href="/collection" data-nav="collection">The Collection</a>
    <a href="/positioning" data-nav="positioning">The Index</a>
    <a href="/desk" data-nav="desk">Live Desk</a>
    <a href="/pride" data-nav="pride">The Pride</a>
    <a href="/pulse" data-nav="pulse">The Pulse</a>
    <a href="/observatory" data-nav="observatory">The Observatory</a>
  </nav>
</div></header>
<div id="space"></div>
<div id="ov"></div>
<div class="load" id="load">charting the sky…</div>
<div class="hud">
  <span class="kicker">The Observatory</span>
  <span class="hint" id="hint">drag to pan · scroll or pinch to zoom · tap a Hypurr</span>
  <label class="find">⌕ <input id="fly" placeholder="find # id" inputmode="numeric"></label>
  <span class="zoomer"><button id="zo" aria-label="zoom out">−</button><button id="zi" aria-label="zoom in">+</button></span>
</div>
<div class="tip" id="tip"></div>
<script src="/assets/three.min.js"></script>
<script>
(async function(){
  const mobile = matchMedia('(max-width:860px)').matches || 'ontouchstart' in window;
  const [OBS, META, CS] = await Promise.all([
    HT.json('/data/obs.json'), HT.json('/assets/atlas_meta.json'),
    HT.json('/data/cat_states.json', true).catch(()=>({states:''}))
  ]);
  const GW=OBS.gw, GH=OBS.gh, PTS=OBS.pts, N=PTS.length, COLS=META.cols, states=CS.states||'';
  const cellOf={};                                     // "gx,gy" -> token index
  for(let i=0;i<N;i++) cellOf[PTS[i][0]+','+PTS[i][1]]=i;
  const wx=i=>PTS[i][0]+0.5, wy=i=>(GH-1-PTS[i][1])+0.5;   // world coords, y-up

  const mount=document.getElementById('space');
  let W=innerWidth,H=innerHeight;
  const renderer=new THREE.WebGLRenderer({antialias:false,alpha:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(2,devicePixelRatio||1)); renderer.setSize(W,H);
  mount.appendChild(renderer.domElement);
  const scene=new THREE.Scene();
  const camera=new THREE.OrthographicCamera(-1,1,1,-1,-10,10);
  camera.position.z=5;

  // ---- instanced sprites on the grid ----
  const quad=new THREE.PlaneBufferGeometry(1,1);
  const geo=new THREE.InstancedBufferGeometry();
  geo.index=quad.index; geo.attributes.position=quad.attributes.position; geo.attributes.uv=quad.attributes.uv;
  const pos=new Float32Array(N*3), aIdx=new Float32Array(N), aRand=new Float32Array(N), aState=new Float32Array(N), aColor=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    pos[i*3]=wx(i); pos[i*3+1]=wy(i); pos[i*3+2]=0;
    aIdx[i]=i; aRand[i]=Math.random();
    aState[i]=states[i]==='1'?1:states[i]==='2'?2:0;
    const hex=META.colors[i]||'8a7a5f';
    aColor[i*3]=parseInt(hex.slice(0,2),16)/255; aColor[i*3+1]=parseInt(hex.slice(2,4),16)/255; aColor[i*3+2]=parseInt(hex.slice(4,6),16)/255;
  }
  geo.setAttribute('aCur',new THREE.InstancedBufferAttribute(pos,3));
  geo.setAttribute('aIdx',new THREE.InstancedBufferAttribute(aIdx,1));
  geo.setAttribute('aRand',new THREE.InstancedBufferAttribute(aRand,1));
  geo.setAttribute('aState',new THREE.InstancedBufferAttribute(aState,1));
  geo.setAttribute('aColor',new THREE.InstancedBufferAttribute(aColor,3));
  const uniforms={uTime:{value:0},uSize:{value:0.9},
    uAtlas:{value:null},uAtlasReady:{value:0},uCols:{value:COLS}};
  const mat=new THREE.ShaderMaterial({uniforms,transparent:true,depthWrite:false,depthTest:false,
    vertexShader:`
      attribute vec3 aCur; attribute vec3 aColor;
      attribute float aIdx; attribute float aRand; attribute float aState;
      uniform float uSize; uniform float uCols;
      varying vec2 vUv; varying vec2 vCell; varying vec3 vColor; varying float vState; varying float vRand;
      void main(){
        vec4 mv=modelViewMatrix*vec4(aCur,1.0);
        mv.xy+=position.xy*uSize;
        gl_Position=projectionMatrix*mv;
        vUv=uv; vColor=aColor; vState=aState; vRand=aRand;
        vCell=vec2(mod(aIdx,uCols),floor(aIdx/uCols));
      }`,
    fragmentShader:`
      uniform sampler2D uAtlas; uniform float uAtlasReady; uniform float uTime; uniform float uCols;
      varying vec2 vUv; varying vec2 vCell; varying vec3 vColor; varying float vState; varying float vRand;
      void main(){
        vec2 cuv=vec2((vCell.x+vUv.x)/uCols,1.0-(vCell.y+1.0-vUv.y)/uCols);
        vec2 p=vUv*2.0-1.0; float r=0.30; vec2 q=abs(p)-(1.0-r);
        float sd=length(max(q,0.0))-r; float mask=1.0-smoothstep(-0.08,0.02,sd);
        if(mask<0.01) discard;
        vec4 tex=texture2D(uAtlas,cuv);
        float d=length(p); float ember=1.0-smoothstep(0.15,0.95,d);
        vec3 col=mix(vColor*(0.9+0.6*ember),tex.rgb,uAtlasReady);
        float alpha=mix(ember*0.95,mask,uAtlasReady);
        if(vState>0.5){ float pulse=0.5+0.5*sin(uTime*2.0+vRand*6.2831);
          vec3 g=vState>1.5?vec3(0.95,0.52,0.44):vec3(0.33,0.88,0.80);
          col+=g*smoothstep(0.55,1.0,d)*(0.10+0.13*pulse); }
        gl_FragColor=vec4(col,alpha);
      }`});
  scene.add(new THREE.Mesh(geo,mat));

  // atlas
  const img=new Image(); let t0=0;
  img.onload=()=>{const tex=new THREE.Texture(img);tex.minFilter=THREE.LinearFilter;tex.magFilter=THREE.LinearFilter;tex.generateMipmaps=false;tex.needsUpdate=true;uniforms.uAtlas.value=tex;t0=performance.now();document.getElementById('load').style.opacity=0;};
  img.src = mobile ? '/assets/atlas24.webp' : '/assets/atlas48.webp';

  // ---- map view state ----
  let cx=GW/2, cy=GH/2, scale=1, sMin=1, sMax=170;
  function fitScale(){ return Math.min((W-36)/GW, (H-200)/GH); }   // clear the header + HUD
  function clampView(){
    scale=Math.max(sMin,Math.min(sMax,scale));
    const mx=GW/2+ (W/scale)/2 - 2, my=GH/2 + (H/scale)/2 - 2;   // keep map roughly on screen
    cx=Math.max(GW-mx,Math.min(mx,cx)); cy=Math.max(GH-my,Math.min(my,cy));
  }
  function applyCam(){
    camera.left=-(W/2)/scale; camera.right=(W/2)/scale;
    camera.top=(H/2)/scale; camera.bottom=-(H/2)/scale;
    camera.position.x=cx; camera.position.y=cy;
    camera.updateProjectionMatrix();
  }
  function s2w(px,py){ return [cx+(px-W/2)/scale, cy-(py-H/2)/scale]; }
  function w2s(x,y){ return [(x-cx)*scale+W/2, (cy-y)*scale+H/2]; }

  // ---- crisp overlay: full-res thumbs once cats are big on screen ----
  const ov=document.getElementById('ov'), OVAT=90;      // px-per-cell threshold
  const ovMap=new Map();                                // id -> img
  let halo=null, haloId=-1;
  function syncOverlay(){
    const on=scale>=OVAT;
    const wantIds=new Set();
    if(on){
      const [x0,y0]=s2w(0,0), [x1,y1]=s2w(W,H);
      const gx0=Math.max(0,Math.floor(x0-1)), gx1=Math.min(GW-1,Math.ceil(x1));
      const gy1w=Math.max(0,Math.floor(y1-1)), gy0w=Math.min(GH-1,Math.ceil(y0));
      for(let gx=gx0;gx<=gx1;gx++) for(let ywu=gy1w;ywu<=gy0w;ywu++){
        const gy=GH-1-ywu;
        const i=cellOf[gx+','+gy];
        if(i!==undefined) wantIds.add(i);
      }
    }
    for(const [i,im] of ovMap) if(!wantIds.has(i)){ im.remove(); ovMap.delete(i); }
    for(const i of wantIds){
      if(!ovMap.has(i)){
        const im=document.createElement('img');
        im.src='/img/'+(i+1)+'.webp'; im.alt='';
        im.style.left=(wx(i)*100-44)+'px'; im.style.top=((GH-wy(i))*100-44)+'px';
        im.onload=()=>im.classList.add('in');
        if(im.complete) im.classList.add('in');
        ov.appendChild(im); ovMap.set(i,im);
      }
    }
    if(halo){ halo.style.display = (haloId>=0 && on) ? '' : (haloId>=0?'':'none'); }
    const [ox,oy]=w2s(0,GH);                            // world top-left corner
    ov.style.transform=`translate(${ox}px,${oy}px) scale(${scale/100})`;
    ov.style.display = (on||haloId>=0) ? '' : 'none';
  }
  function setHalo(i){
    haloId=i;
    if(!halo){ halo=document.createElement('div'); halo.className='halo'; ov.appendChild(halo); }
    halo.style.left=(wx(i)*100-44)+'px'; halo.style.top=((GH-wy(i))*100-44)+'px';
    ov.style.display='';
    clearTimeout(setHalo.t); setHalo.t=setTimeout(()=>{ haloId=-1; if(halo) halo.remove(); halo=null; }, 6000);
  }

  // ---- interactions: pan / zoom / pick — a map, nothing rotates ----
  const el=renderer.domElement; el.style.touchAction='none';
  const pointers=new Map();
  let moved=0, vxv=0, vyv=0, lastMove=0, pinchD=0, anim=null;
  el.addEventListener('pointerdown',e=>{
    pointers.set(e.pointerId,[e.clientX,e.clientY]);
    moved=0; vxv=vyv=0; anim=null; mount.classList.add('grabbing');
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    if(pointers.size===2){ const p=[...pointers.values()]; pinchD=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]); }
  });
  el.addEventListener('pointermove',e=>{
    if(!pointers.has(e.pointerId)){ if(!mobile) hover(e.clientX,e.clientY); return; }
    const prev=pointers.get(e.pointerId); pointers.set(e.pointerId,[e.clientX,e.clientY]);
    if(pointers.size===1){
      const dx=e.clientX-prev[0], dy=e.clientY-prev[1];
      moved+=Math.abs(dx)+Math.abs(dy);
      cx-=dx/scale; cy+=dy/scale;
      vxv=dx; vyv=dy; lastMove=performance.now();
      clampView();
    } else if(pointers.size===2){
      const p=[...pointers.values()];
      const d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);
      const mx=(p[0][0]+p[1][0])/2, my=(p[0][1]+p[1][1])/2;
      if(pinchD){ zoomAt(mx,my, d/pinchD); }
      pinchD=d; moved=99;
    }
  });
  function endPointer(e){
    pointers.delete(e.pointerId); pinchD=0;
    if(pointers.size===0){
      mount.classList.remove('grabbing');
      if(moved<8 && e.type==='pointerup') pick(e.clientX,e.clientY);
      if(performance.now()-lastMove>90) vxv=vyv=0;      // held still: no fling
    }
  }
  el.addEventListener('pointerup',endPointer);
  el.addEventListener('pointercancel',endPointer);
  function zoomAt(px,py,f){
    const [wxp,wyp]=s2w(px,py);
    scale*=f; scale=Math.max(sMin,Math.min(sMax,scale));
    cx=wxp-(px-W/2)/scale; cy=wyp+(py-H/2)/scale;
    clampView();
  }
  el.addEventListener('wheel',e=>{ e.preventDefault(); anim=null; zoomAt(e.clientX,e.clientY, Math.exp(-e.deltaY*0.0016)); },{passive:false});
  document.getElementById('zi').addEventListener('click',()=>{anim=null; zoomAt(W/2,H/2,1.55);});
  document.getElementById('zo').addEventListener('click',()=>{anim=null; zoomAt(W/2,H/2,1/1.55);});

  // pick / hover: O(1) via the grid
  const tip=document.getElementById('tip');
  function catAt(px,py){
    const [x,y]=s2w(px,py);
    const gx=Math.floor(x), gyw=Math.floor(y), gy=GH-1-gyw;
    if(gx<0||gy<0||gx>=GW||gy>=GH) return -1;
    const i=cellOf[gx+','+gy];
    if(i===undefined) return -1;
    return (Math.abs(x-wx(i))<0.46 && Math.abs(y-wy(i))<0.46) ? i : -1;
  }
  function pick(px,py){ const i=catAt(px,py); if(i>=0) location.href='/cat/'+(i+1); }
  function hover(px,py){
    const i=catAt(px,py);
    if(i>=0){ tip.textContent='Hypurr #'+(i+1)+(states[i]&&states[i]!=='0'?' · live on the tape':'');
      tip.style.opacity=1; tip.style.left=Math.min(px+14,W-170)+'px'; tip.style.top=(py+16)+'px';
      el.style.cursor='pointer';
    } else { tip.style.opacity=0; el.style.cursor=''; }
  }

  // fly-to (search + deep link)
  function flyTo(id){
    const i=id-1; if(i<0||i>=N) return;
    anim={x0:cx,y0:cy,s0:scale,x1:wx(i),y1:wy(i),s1:Math.max(scale,120),t0:performance.now(),d:900};
    setHalo(i);
    document.getElementById('hint').textContent='Hypurr #'+id+' — tap it to open the passport';
  }
  document.getElementById('fly').addEventListener('keydown',e=>{
    if(e.key!=='Enter') return;
    const id=parseInt(e.target.value,10);
    if(id>=1&&id<=N){ flyTo(id); e.target.blur(); }
  });
  const qc=new URLSearchParams(location.search).get('c');

  function resize(){ W=innerWidth;H=innerHeight;renderer.setSize(W,H); sMin=fitScale(); clampView(); }
  addEventListener('resize',resize);
  resize();
  scale=sMin; clampView();
  if(qc) setTimeout(()=>flyTo(parseInt(qc,10)), 600);

  const clock={t:0,last:performance.now()};
  const ease=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  (function frame(now){
    requestAnimationFrame(frame);
    const dt=Math.min(0.05,(now-clock.last)/1000); clock.last=now; clock.t+=dt;
    uniforms.uTime.value=clock.t;
    if(t0) uniforms.uAtlasReady.value=Math.min(1,(performance.now()-t0)/900);
    if(anim){
      const t=Math.min(1,(now-anim.t0)/anim.d), k=ease(t);
      cx=anim.x0+(anim.x1-anim.x0)*k; cy=anim.y0+(anim.y1-anim.y0)*k;
      scale=anim.s0+(anim.s1-anim.s0)*k;
      if(t>=1) anim=null;
      clampView();
    } else if(pointers.size===0 && (Math.abs(vxv)>0.4||Math.abs(vyv)>0.4)){
      cx-=vxv/scale; cy+=vyv/scale; vxv*=0.93; vyv*=0.93; clampView();   // gentle glide after fling
    }
    applyCam();
    syncOverlay();
    renderer.render(scene,camera);
  })(performance.now());
})().catch(e=>console.error('observatory:',e));
</script>
</body></html>
