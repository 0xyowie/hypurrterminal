<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hypurr Terminal · The Pride</title>
<meta name="description" content="Diamond hands vs the market: which Hypurrs never left the wallet they were dealt, which changed hands most, and their full HYPE price history.">
<meta name="theme-color" content="#0E0B08">
<meta property="og:type" content="website">
<meta property="og:title" content="Hypurr Terminal · The Pride"><meta property="og:description" content="Diamond hands vs the market: which Hypurrs never left the wallet they were dealt, which changed hands most, and their full HYPE price history.">
<meta property="og:image" content="https://hypurrterminal.xyz/og.png">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://hypurrterminal.xyz/og.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.png" sizes="48x48" type="image/png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/base.css">
<script src="/assets/app.js"></script>
<style>
  :root{--diamond:#7CC6F0; --fire:#F2856F}
  .wrap{max-width:1120px}
  .kicker{color:var(--diamond)}
  h1.big{font-family:'Bricolage Grotesque';font-size:clamp(38px,5.6vw,60px);line-height:.97;font-weight:700;letter-spacing:-.03em;margin:10px 0 0;max-width:860px}
  h1.big .d{color:var(--diamond)}
  .lead{color:var(--dim);font-weight:500;font-size:15.5px;margin:14px 0 0;max-width:640px;line-height:1.5}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0 6px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
  .tile b{font-family:'Bricolage Grotesque';font-weight:700;font-size:26px;display:block;line-height:1}
  .tile.d b{color:var(--diamond)} .tile.f b{color:var(--fire)}
  .tile span{font-weight:600;font-size:12px;color:var(--dim);margin-top:6px;display:block}
  .toggle{display:flex;gap:8px;margin:22px 0 6px;flex-wrap:wrap;align-items:center}
  .toggle button{cursor:pointer;border:1px solid var(--line2);background:var(--panel2);border-radius:12px;padding:9px 16px;font-weight:600;font-size:14px;color:var(--dim);font-family:'Inter';transition:.25s var(--ease)}
  .toggle button.on{background:var(--ink);color:#12100b;border-color:var(--ink)}
  .btn{cursor:pointer;border:1px solid var(--line2);background:var(--panel2);border-radius:11px;padding:8px 14px;font-weight:600;font-size:13.5px;color:var(--ink);transition:.25s var(--ease)}
  .btn.on{background:var(--mint);color:#0b0906;border-color:var(--mint)}
  .pfilt{display:flex;gap:8px;margin:10px 0 6px;flex-wrap:wrap;align-items:center}
  .pfilt .field{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line2);border-radius:11px;padding:8px 12px;font-weight:600;color:var(--dim);font-size:13px;min-width:0}
  .pfilt .field input,.pfilt .field select{border:0;outline:0;background:transparent;font-family:'Inter';font-weight:600;font-size:14px;color:var(--ink);min-width:0}
  .pfilt .field select{cursor:pointer;text-overflow:ellipsis} .pfilt .field select option{background:#1a140d;color:var(--ink)}
  .pfilt .qf{flex:1;min-width:150px}
  .pfilt .qf input{width:100%}
  .pcount{margin-left:auto;font-weight:700;font-size:12.5px;color:var(--faint)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(198px,1fr));gap:16px;margin:16px 0 20px}
  .oc{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative;transition:transform .18s var(--ease),box-shadow .18s,border-color .18s;cursor:pointer}
  .oc:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.5);border-color:var(--line2)}
  .oc .th{aspect-ratio:1;background:var(--panel2);position:relative}
  .oc .th img{width:100%;height:100%;object-fit:cover;display:block}
  .rank{position:absolute;top:8px;left:8px;font-family:'Bricolage Grotesque';font-weight:700;font-size:14px;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#2a1e08;box-shadow:0 3px 10px rgba(0,0,0,.4)}
  .dbadge{position:absolute;top:8px;left:8px;font-family:'Bricolage Grotesque';font-weight:600;font-size:13px;background:rgba(14,11,8,.85);border:1px solid var(--diamond);color:var(--diamond);padding:4px 10px;border-radius:999px}
  .fbadge{position:absolute;top:8px;left:8px;font-family:'Bricolage Grotesque';font-weight:600;font-size:14px;background:rgba(14,11,8,.85);border:1px solid var(--fire);color:var(--fire);padding:4px 11px;border-radius:999px}
  .trbadge{position:absolute;top:8px;right:8px;display:flex;align-items:center;gap:5px;background:rgba(14,11,8,.85);border:1px solid var(--mint);color:var(--mint);font-family:'Bricolage Grotesque';font-weight:600;font-size:11px;padding:3px 8px;border-radius:999px}
  .tdot{width:7px;height:7px;border-radius:50%;background:var(--mint)}
  .oc .m{padding:11px 13px 14px}
  .oc .m .ow{font-family:'Bricolage Grotesque';font-weight:600;font-size:15px}
  .oc .m .sub{font-weight:500;font-size:11.5px;color:var(--dim);margin-top:4px}
  .oc .m .sub b{color:var(--ink)} .oc .m .sub code{background:var(--panel2);padding:1px 5px;border-radius:5px;border:1px solid var(--line)}
  .modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.66);backdrop-filter:blur(5px)}
  .modal.open{display:flex}
  .sheet{position:relative;background:var(--panel);border-radius:22px;max-width:620px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.6);border:1px solid var(--line2)}
  .sheet .hd{display:flex;gap:14px;align-items:center;padding:18px 20px 8px}
  .sheet .hd img{width:74px;height:74px;border-radius:15px;object-fit:cover;background:var(--panel2)}
  .sheet .hd .nm{font-family:'Bricolage Grotesque';font-weight:600;font-size:20px}
  .sheet .hd .rk{font-weight:600;font-size:12.5px;color:var(--diamond);margin-top:2px}
  .x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:rgba(14,11,8,.72);backdrop-filter:blur(6px);color:var(--ink);font-size:17px;cursor:pointer;z-index:3;display:grid;place-items:center;line-height:1}
  .tl{padding:6px 20px 22px}
  .tl-stat{font-weight:500;font-size:13.5px;color:var(--dim);margin:6px 0 16px}
  .tl-stat b{color:var(--ink)} .tl-stat code{background:var(--panel2);padding:1px 6px;border-radius:6px;border:1px solid var(--line)}
  .tl-track{position:relative;height:30px;margin:4px 4px}
  .tl-line{position:absolute;top:14px;left:0;right:0;height:3px;border-radius:2px;background:var(--line2)}
  .tl-dot{position:absolute;top:7px;width:15px;height:15px;border-radius:50%;transform:translateX(-50%);border:2.5px solid var(--panel);box-shadow:0 2px 6px rgba(0,0,0,.5);cursor:pointer}
  .tl-dot.mint{background:var(--faint)} .tl-dot.airdrop{background:var(--mint)} .tl-dot.trade{background:var(--fire)}
  .tl-axis{display:flex;justify-content:space-between;font-weight:700;font-size:11px;color:var(--faint);margin:2px 4px 0}
  .tl-leg{display:flex;gap:14px;margin:12px 4px 2px;font-weight:600;font-size:11.5px;color:var(--dim)}
  .tl-leg i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
  .tl-list{margin-top:12px;max-height:220px;overflow:auto;border-top:1px solid var(--line)}
  .tl-row{display:grid;grid-template-columns:88px 128px 1fr;gap:8px;padding:8px 2px;border-bottom:1px dashed var(--line);font-weight:600;font-size:13px;align-items:center}
  .tl-k{font-family:'Bricolage Grotesque';font-weight:600;text-transform:capitalize;padding:1px 9px;border-radius:999px;font-size:11.5px;justify-self:start}
  .tl-k.mint{background:var(--panel2);color:var(--dim);border:1px solid var(--line2)} .tl-k.airdrop{background:var(--long-soft);color:var(--mint)} .tl-k.trade{background:var(--short-soft);color:var(--fire)}
  .tl-d{color:var(--dim)} .tl-o{font-weight:700;color:var(--ink)}
  .tl-head{font-family:'Bricolage Grotesque';font-weight:600;font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.18em;margin:12px 20px 2px}
  .vc{padding:6px 20px 18px} .vc-none{padding:2px 20px 16px;font-weight:500;font-size:13px;color:var(--faint)}
  .vc-stat{font-weight:500;font-size:13.5px;color:var(--dim);margin:2px 0 8px} .vc-stat b{color:var(--grape);font-family:'Bricolage Grotesque'}
  .vc-svg{width:100%;height:120px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px}
  .vc-axis{display:flex;justify-content:space-between;font-weight:700;font-size:11px;color:var(--faint);margin:4px 2px 0}
  .mktbar{display:flex;gap:16px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:12px 16px;margin:4px 0 12px;font-weight:600;font-size:13px;color:var(--dim)}
  .mktbar b{font-family:'Bricolage Grotesque';font-weight:600;color:var(--gold)}
  @media(max-width:720px){.tiles{grid-template-columns:1fr 1fr}.tl-row{grid-template-columns:78px 1fr}.tl-o{grid-column:2}}
  @media(max-width:560px){
    .grid{grid-template-columns:1fr 1fr;gap:12px}
    .oc .m{padding:9px 11px 11px}
    .oc .m .ow{font-size:13.5px}
    .oc .m .sub{font-size:10.5px}
    .toggle{gap:8px}
    .toggle #t-dia,.toggle #t-flip{flex:1}
    .pfilt{display:grid;grid-template-columns:1fr 1fr}
    .pfilt > *{min-width:0;width:100%}
    .pfilt .qf{grid-column:1 / -1}
    .pcount{grid-column:1 / -1;margin-left:0;text-align:right}
  }
</style></head>
<body data-page="pride">
<header class="site"><div class="bar">
  <a class="brand" href="/"><img class="logo" src="/favicon.svg" alt="" width="33" height="33"><span>HYPURR<em class="tm">TERMINAL</em></span></a>
  <nav class="top">
    <a href="/collection" data-nav="collection">The Collection</a>
    <a href="/positioning" data-nav="positioning">The Index</a>
    <a href="/desk" data-nav="desk">Live Desk</a>
    <a href="/pride" data-nav="pride">The Pride</a>
  </nav>
</div></header>
<div class="wrap">
  <div class="kicker">The Pride · diamond hands vs the market</div>
  <h1 class="big disp"><span id="h-never">–</span> Hypurrs have <span class="d">never left the hand they were dealt.</span></h1>
  <div class="lead" id="lead">loading…</div>
  <div class="tiles" id="tiles"></div>
  <div class="toggle">
    <button id="t-dia" class="on">💎 Diamond hands</button>
    <button id="t-flip">🔥 Most flipped</button>
  </div>
  <div class="pfilt">
    <label class="field qf">⌕ <input id="pq" placeholder="wallet or Hypurr # id"></label>
    <label class="field">sort <select id="psort"></select></label>
    <button class="btn" id="onlyTrade">only still trading</button>
    <span class="pcount" id="pcount"></span>
  </div>
  <div class="grid" id="grid"></div>
</div>
<footer class="site"><div class="foot">
  <span id="note"></span>
  <div class="lg"><a href="/privacy">Privacy</a><a href="/privacy">Cookies</a><span>· Hypurr Terminal, unofficial community tool</span></div>
</div></footer>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="tt" id="tt"></div>
<script>
(async function(){
  const [O, POS, PROVRAW, SALES] = await Promise.all([
    HT.json('/data/og.json'), HT.json('/data/positions.json',true), HT.json('/data/provenance.json'), HT.json('/data/sales.json')
  ]);
  const PROV = { nowTs: PROVRAW.nowTs, byId: PROVRAW.prov };
  const positions = POS.wallets;
  const trading = a => !!(positions[a] && positions[a].hasPosition);
  const esc=HT.esc, short=HT.short, num=HT.num, fmtD=HT.fmtD, img=HT.img;
  const S=O.stats;
  let view='dia', onlyTrade=false, q='', sortDia='rare', sortFlip='flips';
  const lastSale=id=>{const s=SALES&&SALES.byToken&&SALES.byToken[id];return s&&s.length?s[s.length-1].price:0;};
  const lastTs=id=>{const s=SALES&&SALES.byToken&&SALES.byToken[id];return s&&s.length?(s[s.length-1].ts||0):0;};
  // digits = id prefix, anything else = wallet match
  const matchQ=(q,id,owner)=> /^\d+$/.test(q) ? String(id).startsWith(q) : (owner||'').toLowerCase().includes(q);
  document.getElementById('h-never').textContent=num(S.neverTraded);
  document.getElementById('lead').textContent=`All 4,600 Hypurrs were airdropped on the same day, ${S.airdropDate}, ${S.daysSinceAirdrop} days ago. ${num(S.neverTraded)} of them have sat in their original wallet ever since. The other ${num(S.tradedCats)} have changed hands ${num(S.totalTrades)} times. Click any Hypurr for its full history.`;
  document.getElementById('tiles').innerHTML=`
    <div class="tile d"><b>${num(S.diamondWallets)}</b><span>diamond-hand wallets</span></div>
    <div class="tile"><b>${Math.round(S.neverTraded/S.supply*100)}%</b><span>never traded</span></div>
    <div class="tile f"><b>${num(S.totalTrades)}</b><span>secondary trades</span></div>
    <div class="tile f"><b>#${S.mostFlipped.id}</b><span>most flipped · ${S.mostFlipped.flips}×</span></div>`;
  document.getElementById('t-dia').onclick=()=>{view='dia';sync();};
  document.getElementById('t-flip').onclick=()=>{view='flip';sync();};
  document.getElementById('onlyTrade').onclick=e=>{onlyTrade=!onlyTrade;e.target.classList.toggle('on',onlyTrade);render();};
  const pq=document.getElementById('pq'), psort=document.getElementById('psort');
  pq.oninput=()=>{ q=pq.value.trim().toLowerCase(); render(); };
  psort.onchange=()=>{ if(view==='dia') sortDia=psort.value; else sortFlip=psort.value; render(); };
  function fillSort(){
    const opts = view==='dia'
      ? [['rare','rarest first'],['id','mint order']]
      : [['flips','most flips'],['recent','recently traded'],['price','priciest last sale'],['rare','rarest']];
    psort.innerHTML = opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('');
    psort.value = view==='dia' ? sortDia : sortFlip;
  }
  function sync(){document.getElementById('t-dia').classList.toggle('on',view==='dia');document.getElementById('t-flip').classList.toggle('on',view==='flip');
    pq.placeholder = 'wallet or Hypurr # id';
    fillSort(); render();}
  function render(){
    let html='', n=0;
    if(view==='dia'){
      // the airdrop was one-per-wallet, so diamonds are the never-traded Hypurrs themselves
      let rows=O.diamonds.slice();
      if(onlyTrade) rows=rows.filter(r=>trading(r.owner));
      if(q) rows=rows.filter(r=>matchQ(q,r.id,r.owner));
      rows.sort(sortDia==='id' ? (a,b)=>a.id-b.id : (a,b)=>a.rarityRank-b.rarityRank);
      n=rows.length;
      html=rows.map(r=>{const st=trading(r.owner);return `<div class="oc" onclick="openCat(${r.id})">
        <div class="th"><img loading="lazy" src="${img(r.id)}" alt="">
          <span class="dbadge">💎 day one</span>
          ${st?`<span class="trbadge"><span class="tdot"></span>trading</span>`:''}</div>
        <div class="m"><div class="ow">Hypurr #${r.id}</div>
          <div class="sub">rarest <b>#${r.rarityRank}</b> · never left <code>${short(r.owner)}</code></div></div>
      </div>`;}).join('');
    } else {
      const st=SALES?SALES.stats:null;
      const bar=st?`<div class="mktbar" style="grid-column:1/-1">Secondary sales: <b>${st.totalSales.toLocaleString()}</b> · <b>${st.totalVolumeHype.toLocaleString()}</b> HYPE volume · avg <b>${st.avgPriceHype.toLocaleString()}</b> HYPE · top sale <b>${st.maxSale.hype.toLocaleString()} HYPE</b> (#${st.maxSale.id})</div>`:'';
      let rows=O.flipped.slice();
      if(onlyTrade) rows=rows.filter(r=>trading(r.owner));
      if(q) rows=rows.filter(r=>matchQ(q,r.id,r.owner));
      rows.sort(sortFlip==='rare' ? (a,b)=>a.rarityRank-b.rarityRank
              : sortFlip==='price' ? (a,b)=>lastSale(b.id)-lastSale(a.id)
              : sortFlip==='recent' ? (a,b)=>lastTs(b.id)-lastTs(a.id)
              : (a,b)=>b.flips-a.flips||a.rarityRank-b.rarityRank);
      n=rows.length;
      html=bar+rows.map(r=>{const ot=trading(r.owner); const ls=lastSale(r.id);
        return `<div class="oc" onclick="openCat(${r.id})">
        <div class="th"><img loading="lazy" src="${img(r.id)}" alt="">
          <span class="fbadge">🔥 ${r.flips}×</span>
          ${ot?`<span class="trbadge"><span class="tdot"></span>trading</span>`:''}</div>
        <div class="m"><div class="ow">Hypurr #${r.id}</div>
          <div class="sub">traded <b>${r.flips}</b>× · rarest #${r.rarityRank}${ls?` · last ${ls.toLocaleString()} HYPE`:''} · <code>${short(r.owner)}</code></div></div>
      </div>`;}).join('');
    }
    document.getElementById('pcount').textContent = n + ' Hypurrs';
    document.getElementById('grid').innerHTML=html;
  }
  function timelineHTML(id){
    const P=PROV.byId?PROV.byId[id]:null;
    if(!P) return '<div class="tl-stat">No transfer history available for this Hypurr.</div>';
    const now=PROV.nowTs, start=P.chain[0].ts, span=Math.max(1, now-start);
    const dots=P.chain.map(c=>{const x=Math.min(100,Math.max(0,((c.ts-start)/span)*100));
      return `<span class="tl-dot ${c.kind}" style="left:${x}%" data-t="${c.kind} · ${fmtD(c.ts)} · ${short(c.owner)}"></span>`;}).join('');
    const list=[...P.chain].reverse().map(c=>`<div class="tl-row"><span class="tl-k ${c.kind}">${c.kind}</span><span class="tl-d">${fmtD(c.ts)}</span><span class="tl-o">${short(c.owner)}</span></div>`).join('');
    return `<div class="tl">
      <div class="tl-stat">traded <b>${P.trades}</b> ${P.trades===1?'time':'times'} · airdropped ${fmtD(P.airdropTs||start)} · now held by <code>${short(P.currentOwner)}</code></div>
      <div class="tl-track"><span class="tl-line"></span>${dots}</div>
      <div class="tl-axis"><span>${fmtD(start)}</span><span>today</span></div>
      <div class="tl-leg"><span><i style="background:var(--mint)"></i>airdrop</span><span><i style="background:var(--fire)"></i>trade</span></div>
      <div class="tl-list">${list}</div>
    </div>`;
  }
  function valueChartHTML(id){
    const s=SALES&&SALES.byToken?SALES.byToken[id]:null;
    if(!s||!s.length) return '<h3 class="tl-head" style="margin-top:8px">sale price (HYPE)</h3><div class="vc-none">No HYPE sales recorded on-chain for this Hypurr yet.</div>';
    const prices=s.map(x=>x.price), last=s[s.length-1], hi=Math.max(...prices), lo=Math.min(...prices), avg=Math.round(prices.reduce((a,b)=>a+b,0)/prices.length);
    const W=300,H=120,pad=10, t0=s[0].ts, t1=Math.max(s[s.length-1].ts,t0+1), tspan=t1-t0, pmin=lo, pspan=Math.max(1,hi-lo);
    const pts=s.map(x=>[pad+((x.ts-t0)/tspan)*(W-2*pad), H-pad-((x.price-pmin)/pspan)*(H-2*pad), x]);
    const poly=pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
    const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="var(--grape)" stroke="var(--panel)" stroke-width="1.5" data-t="${p[2].price} HYPE · ${fmtD(p[2].ts)}"/>`).join("");
    return `<h3 class="tl-head" style="margin-top:8px">sale price (HYPE)</h3>
      <div class="vc"><div class="vc-stat">last sale <b>${last.price} HYPE</b> · ${s.length} sale${s.length>1?'s':''} · high ${hi} · avg ${avg}</div>
      <svg viewBox="0 0 ${W} ${H}" class="vc-svg" preserveAspectRatio="none"><polyline points="${poly}" fill="none" stroke="var(--grape)" stroke-width="2.5"/>${dots}</svg>
      <div class="vc-axis"><span>${fmtD(t0)}</span><span>${fmtD(s[s.length-1].ts)}</span></div></div>`;
  }
  window.openCat=function(id){
    const flip=O.flipped.find(f=>f.id===id);
    document.getElementById('sheet').innerHTML=`<button class="x" onclick="closeM()">×</button>
      <div class="hd"><img src="${img(id)}" alt=""><div><div class="nm">Hypurr #${id}</div>
        <div class="rk">${flip?('traded '+flip.flips+' times'):'held since day one'}</div></div></div>
      <h3 class="tl-head">ownership history</h3>
      ${timelineHTML(id)}
      ${valueChartHTML(id)}`;
    document.getElementById('modal').classList.add('open');
    back.onOpen();
  };
  const modalEl=document.getElementById('modal');
  const back=HT.backClose(modalEl, function(){ modalEl.classList.remove('open'); });
  window.closeM=function(){ back.close(); };
  modalEl.onclick=e=>{if(e.target.id==='modal') back.close();};
  document.addEventListener('keydown',e=>{if(e.key==='Escape') back.close();});
  const tt=document.getElementById('tt');
  document.addEventListener('mousemove',e=>{const el=e.target.closest('[data-t]');
    if(el){tt.textContent=el.getAttribute('data-t');tt.style.opacity=1;tt.style.left=Math.min(e.clientX+12,innerWidth-220)+'px';tt.style.top=(e.clientY+14)+'px';}else tt.style.opacity=0;});
  document.getElementById('note').textContent="Real on-chain history: every Hypurr transfer since the Sep 28 2025 airdrop, pulled live. Diamond hands = holding a Hypurr that has never moved from the wallet it was airdropped to. Click a Hypurr to see its ownership timeline.";
  sync();
})().catch(e=>{document.getElementById('lead').textContent='could not load data';console.error(e);});
