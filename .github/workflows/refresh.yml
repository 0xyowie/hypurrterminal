name: Refresh positions

# GitHub delivers scheduled runs late — the measured median gap between real runs was
# 95 minutes against a 15-minute cron, with blackouts up to 4 hours. Two changes make
# the cadence survive that:
#   1. every triggered run performs SEVERAL sweeps, 15 minutes apart, so one delayed
#      trigger still produces a series of refreshes instead of a single stale snapshot;
#   2. a push to main (code, not data) refreshes too, so a deploy is never served with
#      a stale book.
on:
  schedule:
    - cron: '4,34 * * * *'      # asks for every 30 min; each run then sweeps SWEEPS times
  push:
    branches: [main]
    paths-ignore:
      - 'site/data/**'          # the bot's own data commits must not retrigger this
      - '**.md'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      sweeps:
        description: 'How many sweeps this run should perform'
        required: false
        default: '3'

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SWEEPS: ${{ github.event.inputs.sweeps || (github.event_name == 'push' && '1' || '3') }}
      GAP_SECONDS: '900'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sweep Hyperliquid positions -> site/data
        run: |
          set -u
          git config user.name  "hypurr-refresh-bot"
          git config user.email "actions@users.noreply.github.com"

          # site/data is regenerated in full every sweep, so there is nothing in it to
          # merge with whatever landed upstream meanwhile. Rebasing it invites a
          # conflict, and a conflict leaves markers in the checkout that the next read
          # chokes on (seen 2026-07-28: "Unexpected token '<', \"<<<<<<< HE\""). So:
          # keep the fresh data aside, take origin/main as the base, put the data back.
          publish() {
            out="${RUNNER_TEMP}/data-out"
            for attempt in 1 2 3; do
              rm -rf "$out"
              cp -R site/data "$out"
              if ! git fetch --quiet origin main; then sleep 5; continue; fi
              git reset --hard --quiet origin/main
              rm -rf site/data
              cp -R "$out" site/data
              git add site/data
              if git diff --cached --quiet; then
                echo "No change in positions this cycle."
                return 0
              fi
              git commit --quiet -m "data: refresh positions $(date -u +%FT%TZ)"
              if git push --quiet origin HEAD:main; then
                echo "published $(git rev-parse --short HEAD)"
                return 0
              fi
              echo "push attempt $attempt lost a race, retrying"
              sleep $((attempt * 5))
            done
            echo "could not publish this cycle"
            return 1
          }

          fail=0
          for i in $(seq 1 "$SWEEPS"); do
            echo "::group::sweep $i/$SWEEPS"
            if node scripts/refresh-prod.mjs; then
              publish || fail=$((fail+1))
            else
              echo "sweep $i failed"
              fail=$((fail+1))
            fi
            echo "::endgroup::"
            if [ "$i" -lt "$SWEEPS" ]; then sleep "$GAP_SECONDS"; fi
          done
          # One bad sweep inside a run is survivable; every sweep failing is not.
          if [ "$fail" -ge "$SWEEPS" ]; then
            echo "every sweep in this run failed"
            exit 1
          fi

      - name: Report freshness
        if: always()
        continue-on-error: true
        run: |
          # Diagnostics only. This must never be the thing that turns a run red.
          node -e "
            const d = require('./site/data/index.json');
            const age = Math.round((Date.now() - new Date(d.generatedAt)) / 60000);
            console.log('published cycle ' + d.generatedAt + ' (' + age + ' min old)');
            console.log('holders ' + d.holdersTotal + ', live ' + d.holdersWithPosition + ', unread ' + (d.holdersUnread ?? 'n/a'));
          " || echo "could not read site/data/index.json"
