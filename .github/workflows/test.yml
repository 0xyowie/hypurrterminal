name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/data/**'          # the refresh bot commits data every cycle
  pull_request:
  schedule:
    - cron: '17 */6 * * *'      # production health: data integrity + freshness
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    # Full browser suite on code changes; the schedule only needs the data pass.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  production-data:
    # Runs on the schedule: catches a stalled refresh, a bad snapshot or a PnL leak
    # in production without needing a code change to trigger it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:data
        env:
          GH_REPO: ${{ github.repository }}
